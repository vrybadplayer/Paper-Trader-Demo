# Model Routing Definitions
model_routing:
  ollama_base_url: "http://localhost:11434"
  request_timeout: 60
  worker_engine:
    primary: "deepseek-r1:14b"
    cloud_fallback: "deepseek-r1:7b"
    temperature: 0.1
    mode: "System 1: Deep Quantitative Researcher (DeepSeek-R1 CoT Alpha Setup)"
  critic_engine:
    primary: "deepseek-r1:14b"
    cloud_fallback: "deepseek-r1:32b"
    temperature: 0.1
    mode: "System 2: Deep Chain-of-Thought (Risk Auditing & Market Psychology)"

# Single Stock Universe (Alpaca / NVDA)
tickers:
  - "NVDA"

# System Constants (in USD)
system:
  cash_reserve: 5000.0    # $5,000 Minimum cash reserve invariant
  max_position_size: 0.25 # Maximum 25% of equity per position
  risk_free_rate: 0.05    # 5.0% US Fed benchmark rate

# Broker Configuration (Alpaca Paper Trading API)
broker:
  type: "alpaca"                       # "alpaca"
  provider: "alpaca"                   # Alpaca Markets Paper Trading
  currency: "USD"
  base_url: "https://paper-api.alpaca.markets"
  data_url: "https://data.alpaca.markets"
  data_feed: "iex"
  sandbox_enabled: false
  live_enabled: true                   # Active for Alpaca paper execution
  paper_trading: true
  sandbox_initial_balance: 100000.0    # $100,000 initial paper capital
  shark_block_threshold_usd: 150000.0  # Flag institutional block trades >= $150,000
  shark_block_min_shares: 1000         # Flag orders >= 1,000 shares
  commission_per_trade: 0.0            # Zero commission on Alpaca
  slippage_model: "fixed"

# ChromaDB Configuration
chromadb:
  persist_directory: "./database/data/chroma_db"
  collection_name: "trading_memory"
  embedding_function: "default"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./database/logs/trading_bot.log"
